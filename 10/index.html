    @media(max-width:390px){.controls{gap:5px}.brand{gap:7px;font-size:12px}.utility{font-size:11px}.answer{min-width:49px;padding:7px}.answers{gap:7px}.lead{font-size:17px}.mini-legend{font-size:12px}.bead{width:15px;height:22px}.rod{gap:3px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    .intro-side .poster-operations{display:grid;gap:9px;width:100%;margin:17px 0 0}

<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span><span>Мастерская математики · 2 класс</span></div><div class="controls"><button class="utility" id="soundButton" aria-pressed="false" title="Включить или выключить звуковой сигнал">♪ Звук: выкл.</button><button class="utility" id="fullButton" title="Развернуть тренажёр">⛶ Экран</button></div></header>
  <main id="main" aria-live="off"></main>
  <footer class="footer">Состав числа 10 · Наглядность → действие группой → связи между числами → счёт в уме<br>Для самостоятельной работы или занятия с педагогом · Работает без интернета</footer>
</div>
<script>
'use strict';
(function () {
  const main = document.getElementById('main');
  const soundBtn = document.getElementById('soundButton');
  const fullBtn = document.getElementById('fullButton');
  const PAIRS = [5,6,7,8,9];
  const STAGES = [
    {name:'Вижу, сколько не хватает',short:'Рамка',sub:'Посмотри на две пятёрки. Сколько пустых мест осталось до десяти?'},
    {name:'Двигаю всю группу сразу',short:'Бусины',sub:'Верхняя нить показывает первое число. Сколько бусин передвинуть одним движением?'},
    {name:'Семья десятки: сложение и вычитание',short:'Семья',sub:'Сначала собери десятку, затем убирай нужную группу фишек.'},
    {name:'Вспоминаю без картинки',short:'В уме',sub:'Сначала произнеси пример и ответ. Потом выбери число.'}
  ];
  const state = {screen:'intro',stage:0,turn:0,correct:0,locked:false,removed:false,help:false,sound:false,rounds:[],mistakes:0};
  const TOTAL = 30;
  let audio;
  const sum = a => 10-a;
  function answerOptions(answer){
    const values = new Set([answer]);
    for(const n of [answer-1,answer+1,10-answer,answer-2,answer+2,5,3,7,8,9,1,4,2,6,10]) {
      if(n>=1 && n<=10 && values.size<4)values.add(n);
    }
    return [...values].sort((a,b)=>a-b);
  }
  function rounds(){
    return [
      PAIRS.map(a=>({a,b:sum(a),kind:'frame',variant:0,answer:sum(a)})),
      PAIRS.map(a=>({a,b:sum(a),kind:'beads',variant:0,answer:sum(a)})),
      PAIRS.flatMap(a=>[0,1,2].map(variant=>({a,b:sum(a),kind:'family',variant,answer:variant===0?sum(a):variant===1?a:sum(a)}))),
      PAIRS.map((a,i)=>({a,b:sum(a),kind:'mind',variant:[0,1,2,3,0][i],answer:[sum(a),sum(a),a,sum(a),sum(a)][i]}))
    ];
  }
  function current(){return state.rounds[state.stage][state.turn]}
  function progressNum(){return state.rounds.slice(0,state.stage).reduce((x,y)=>x+y.length,0)+state.turn+1}
  function grid(cells, label='Рамка из десяти клеток'){
    return `<div class="ten-grid" role="img" aria-label="${label}">${cells.map(type=>`<div aria-hidden="true" class="ten-cell ${type}"></div>`).join('')}</div>`;
  }
  function frame(a,filled=false,compact=false){
    const types=Array.from({length:10},(_,i)=>i<a?'base':filled?'added':'empty');
    return `<div class="${compact?'memory-visual':'visual-frame'}">${grid(types,`Занято ${filled?10:a} мест из 10. ${filled?'Десятка собрана':`Не хватает ${sum(a)}`}`)}</div>`;
  }
  function poster(){return `<div class="ten-poster" style="transform:rotate(-2deg)"><div class="poster-caption"><span>7 + 3</span><span>= 10</span></div>${grid(Array.from({length:10},(_,i)=>i<7?'base':'added'))}<div class="mini-legend"><span><i class="legend-dot"></i>7</span><span><i class="legend-dot g"></i>3</span></div><div class="poster-operations"><span>10 − 3 = 7</span><span>10 − 7 = 3</span></div><div class="poster-note">Одна десятка — три связанных примера</div></div>`}
  function startHtml(){return `<section class="panel intro"><div class="intro-copy"><div class="eyebrow">2 класс · интерактивный тренажёр</div><h1 class="hero-title">Десятка<br><span class="accent">без пересчёта</span></h1><p class="lead">Учимся видеть число целиком, дополнять до 10 и находить ответ на вычитание по одной картинке.</p><div class="pill-row"><span class="pill">① Дополняю до 10</span><span class="pill">② Двигаю группой</span><span class="pill">③ Убираю группой</span><span class="pill">④ Считаю в уме</span></div><div class="lesson-callout" style="margin:25px 0">Начинаем с <b>5 + 5</b>, затем <b>6 + 4</b>, <b>7 + 3</b>, <b>8 + 2</b>, <b>9 + 1</b>. Каждую пару разбираем на сложение и два вычитания.</div><button class="primary" data-action="start">Начать с 5 + 5 <span aria-hidden="true">→</span></button><p class="smallprint">4 этапа · 30 небольших действий · Без таймера и штрафов · Можно повторить любое занятие.</p></div><div class="intro-side">${poster()}</div></section>`}
  function formula(r, solved){
    const q=solved?`<span class="answer-value">${r.answer}</span>`:'<span class="blank">?</span>';
    let text;
    if(r.kind==='family'){
      if(r.variant===0)text=`${r.a} + ${q} = 10`;
      if(r.variant===1)text=`10 − ${r.b} = ${q}`;
      if(r.variant===2)text=`10 − ${r.a} = ${q}`;
    } else if(r.kind==='mind') {
      if(r.variant===0)text=`${r.a} + ${q} = 10`;
      if(r.variant===1)text=`${q} + ${r.a} = 10`;
      if(r.variant===2)text=`10 − ${r.b} = ${q}`;
      if(r.variant===3)text=`10 − ${r.a} = ${q}`;
    } else text=`${r.a} + ${q} = 10`;
    return `<div class="equation ${solved?'solved':''}">${text}</div>`;
  }
  function beads(a,complete){
    function rod(n,lower){
      function beadsPart(start,count,pending){return Array.from({length:count},(_,j)=>`<span class="bead ${start+j<5?'red':'ivory'} ${pending?'pending':''} ${!lower&&complete&&start+j>=a?'arrive':''}"></span>`).join('')}
      return `<div class="rod"><div class="bead-line left">${beadsPart(0,n,false)}</div><div class="bead-line right">${beadsPart(n,10-n,true)}</div></div>`;
    }
    return `<div class="rekenrek" role="img" aria-label="Сверху ${complete?10:a} бусин слева. Снизу все десять бусин слева"><div>${rod(complete?10:a,false)}</div><div>${rod(10,true)}</div></div><div class="rack-legend"><span>Верхняя нить — добавь группу</span><span>Нижняя нить — 10</span></div>`;
  }
  function pairNav(active){return `<div class="pair-nav" aria-label="Пары десятки">${PAIRS.map((a,i)=>`<span class="${i<active?'done':i===active?'current':''}">${a} + ${sum(a)}</span>`).join('')}</div>`}
  function familyStrip(r){
    const names=[`${r.a} + ${r.b} = 10`,`10 − ${r.b} = ${r.a}`,`10 − ${r.a} = ${r.b}`];
    return `<div class="family-strip" aria-label="Семья чисел">${names.map((x,i)=>`<span class="${i<r.variant||state.locked&&i===r.variant?'done':i===r.variant?'active':''}">${i<r.variant||state.locked&&i===r.variant?x:`${i+1}. ${i===0?'Сложи':'Вычти'}`}</span>`).join('')}</div>`;
  }
  function subtractionVisual(r){
    const remove=r.variant===1?r.b:r.a;
    const cells=Array.from({length:10},(_,i)=>{
      const isA=i<r.a;
      return state.removed && (r.variant===1?!isA:isA)?'removed':isA?'base':'added';
    });
    const remaining=r.variant===1?r.a:r.b;
    return `<div class="subtraction-demo">${grid(cells, state.removed?`Из десяти убрали ${remove} сразу. Осталось ${remaining}`:`Полная десятка состоит из ${r.a} фиолетовых фишек и ${r.b} золотистых фишек`)}<div class="count-labels">${state.removed?`<span>Убрали группу: ${remove}</span><span>Осталась другая группа: ?</span>`:`<span class="purple">${r.a} фиолетовых</span><span class="gold">${r.b} золотистых</span>`}</div>${state.removed?`<div class="removed-caption">Убрали ${remove} одним движением. Сколько осталось?</div>`:`<button class="action-remove" data-action="remove">Убрать ${remove} ${remove===1?'фишку':remove<5?'фишки':'фишек'} одним движением →</button>`}</div>`;
  }
  function visual(r){
    if(r.kind==='frame')return frame(r.a,state.locked);
    if(r.kind==='beads')return beads(r.a,state.locked);
    if(r.kind==='family')return r.variant===0?`<div class="lesson-callout">Было ${r.a}. Добавь ${r.b} одним движением, чтобы заполнить десятку.</div>${frame(r.a,state.locked)}`:subtractionVisual(r);
    return state.help?frame(r.a,state.locked,true):`<div class="mind-placeholder"><span class="star" aria-hidden="true">✦</span>Представь десятку в уме<span class="star" aria-hidden="true">✦</span></div>`;
  }
  function caption(r){
    if(r.kind==='family')return r.variant===0?`Сколько нужно добавить к ${r.a}?`:`Из 10 нужно убрать ${r.variant===1?r.b:r.a} сразу. Сколько останется?`;
    if(r.kind==='mind')return 'Назови ответ вслух. Затем выбери число.';
    return STAGES[state.stage].sub;
  }
  function questionHtml(){
    const r=current(), i=progressNum(), st=STAGES[state.stage];
    const waitForRemoval = r.kind==='family' && r.variant>0 && !state.removed;
    const choices=answerOptions(r.answer).map(v=>`<button class="answer ${r.kind==='frame'?'has-dots':''} ${state.locked&&v===r.answer?'right':''}" data-answer="${v}" ${state.locked||waitForRemoval?'disabled':''} aria-label="Ответ ${v}">${v}${r.kind==='frame'?`<span class="dots" aria-hidden="true">${Array.from({length:v},()=>'<i></i>').join('')}</span>`:''}</button>`).join('');
    return `<section class="panel play"><div class="play-header"><div class="stage-name">Этап ${state.stage+1} из 4 · ${st.short}</div><div class="counter">Задание ${i} из ${TOTAL}</div></div><div class="track"><div style="width:${state.correct/TOTAL*100}%"></div></div><div class="stage-trail">${STAGES.map((x,n)=>`<div class="trail-item ${n<state.stage?'past':n===state.stage?'active':''}">${n<state.stage?'✓ ':''}${n+1}. ${x.short}</div>`).join('')}</div><div class="lesson"><h2 class="lesson-title">${st.name}</h2><p class="lesson-note">${caption(r)}</p>${pairNav(PAIRS.indexOf(r.a))}${r.kind==='family'?familyStrip(r):''}${formula(r,state.locked)}<div class="visual-area">${visual(r)}</div><div class="answer-label">${state.locked?'Верно!':waitForRemoval?'Сначала убери фишки целой группой':'Какое число нужно вставить?'}</div><div class="answers ${waitForRemoval?'hidden':''}">${choices}</div><div class="hint-inline">${!state.locked&&!waitForRemoval?`<button class="hint-button" data-action="hint">${state.help?'Скрыть подсказку':'Нужна подсказка?'}</button>`:''}<div id="hintArea">${state.help&&!state.locked?hintContent(r):''}</div></div><div class="feedback hidden" id="feedback" aria-live="polite" role="status"></div><div class="next-area" id="nextArea">${state.locked?'<button class="primary" data-action="next">Дальше →</button>':''}</div></div></section>`;
  }
  function hintContent(r){
    if(r.kind==='family'&&r.variant!==0)return `<div class="hint-detail">Посмотри на полную десятку: одна группа ${r.a}, вторая ${r.b}. После того как уберёшь одну группу, в рамке останется другая.</div>`;
    if(r.kind==='beads')return `<div class="hint-detail">На верхней нити нужно заполнить все 10 мест. Сколько бусин справа ещё не сдвинуто?</div>`;
    if(r.kind==='mind')return `<div class="hint-detail">Вспомни пару: ${r.a} и ${r.b} дают 10. Проверь по рамке ниже.</div>`;
    return `<div class="hint-detail">Вверху 5 клеток. Во втором ряду посмотри на свободные клетки.</div>`;
  }
  function successMessage(r){
    if(r.kind==='family'){
      if(r.variant===0)return `${r.a} плюс ${r.b} — десять. Добавили целую группу.`;
      if(r.variant===1)return `Из 10 убрали ${r.b}. Осталось ${r.a}.`;
      return `Из 10 убрали ${r.a}. Осталось ${r.b}. Одна пара — и сложение, и вычитание!`;
    }
    if(r.kind==='mind'&&r.variant===2)return `Из 10 убрали ${r.b} — осталось ${r.a}.`;
    if(r.kind==='mind'&&r.variant===3)return `Из 10 убрали ${r.a} — осталось ${r.b}.`;
    return `${r.a} дополняем числом ${r.b}, получается 10.`;
  }
  function onRemove(){
    const r=current();if(r.kind!=='family'||r.variant===0||state.removed||state.locked)return;
    state.removed=true;
    document.querySelector('.visual-area').innerHTML=visual(r);
    document.querySelector('.answer-label').textContent='Сколько осталось в рамке?';
    const answers=document.querySelector('.answers');answers.classList.remove('hidden');answers.querySelectorAll('.answer').forEach(b=>b.disabled=false);
    document.querySelector('.hint-inline').innerHTML='<button class="hint-button" data-action="hint">Нужна подсказка?</button><div id="hintArea"></div>';
  }
  function markAnswer(value,btn){
    if(state.locked)return;
    const r=current();if(r.kind==='family' && r.variant>0 && !state.removed)return;
    if(value!==r.answer){
      state.mistakes++;btn.classList.add('wrong');
      const feedback=document.getElementById('feedback');feedback.className='feedback caution';
      feedback.textContent='Попробуй ещё. Смотри на целую группу, а не пересчитывай по одному.';
      if(state.mistakes>=2&&!state.help&&r.kind==='mind'){state.help=true;document.querySelector('.visual-area').innerHTML=visual(r);const h=document.querySelector('.hint-button');if(h)h.textContent='Скрыть подсказку';document.getElementById('hintArea').innerHTML=hintContent(r);}
      return;
    }
    state.correct++;state.locked=true;state.mistakes=0;playTone();
    document.querySelector('.visual-area').innerHTML=visual(r);
    document.querySelector('.equation').outerHTML=formula(r,true);
    if(r.kind==='family')document.querySelector('.family-strip').outerHTML=familyStrip(r);
    document.querySelector('.answer-label').textContent='Правильно!';
    document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;b.classList.toggle('right',Number(b.dataset.answer)===r.answer);b.classList.remove('wrong')});
    document.querySelector('.hint-inline').innerHTML='';
    const feedback=document.getElementById('feedback');feedback.className='feedback success';feedback.innerHTML=`<strong>Верно!</strong> ${successMessage(r)} <div class="talk">↗ Прочитай весь пример вслух.</div>`;
    document.getElementById('nextArea').innerHTML='<button class="primary" data-action="next">Дальше →</button>';
    document.querySelector('.track>div').style.width=`${state.correct/TOTAL*100}%`;
  }
  function next(){
    if(!state.locked)return;
    state.help=false;state.removed=false;state.locked=false;state.mistakes=0;
    if(state.turn<state.rounds[state.stage].length-1)state.turn++;
    else if(state.stage<STAGES.length-1){state.screen='between';render();return;}
    else {state.screen='done';render();return;}
    render();
  }
  function betweenHtml(){
    const titles=['Ты видишь, сколько не хватает!','Ты передвигаешь число группой!','Ты умеешь складывать и вычитать!'];
    const notes=['Теперь покажем те же пары на бусинах. Двигай всю группу одним действием.','У каждой пары есть ещё два примера на вычитание. Их можно увидеть на той же десятке.','Заключительный этап — те же пары без картинки.'];
    return `<section class="panel stage-transition"><div class="celebration">✦</div><div class="tag">Этап ${state.stage+1} пройден · ${state.correct} из ${TOTAL}</div><h2>${titles[state.stage]}</h2><div class="learned">${PAIRS.map(a=>`<b>${a} + ${sum(a)}</b>`).join('')}</div><p>${notes[state.stage]}</p><button class="primary" data-action="continue">Перейти к этапу ${state.stage+2} →</button></section>`;
  }
  function doneHtml(){
    return `<section class="panel done-view"><div class="celebration" aria-hidden="true">✦ ✿ ✦</div><div class="tag">Все 5 пар пройдены!</div><h1>Десятку умеем<br>собирать и разбирать!</h1><p>Ты выполнил <b>${TOTAL} заданий</b> и увидел, что один и тот же рисунок помогает и складывать, и вычитать.</p><div class="achievement"><span>✓ 5 + 5 → 9 + 1</span><span>✓ Добавили группой</span><span>✓ Убрали группой</span></div><div class="worked-families">${PAIRS.map(a=>{const b=sum(a);return `<div class="worked-family"><strong>${a} + ${b} = 10</strong><span>10 − ${b} = ${a}</span><span>10 − ${a} = ${b}</span></div>`}).join('')}</div><p class="final-note">Попробуй без подсказки назвать все пары от 5 + 5 до 9 + 1. На следующем занятии повтори коротко — сначала без рамки, потом с ней, если понадобится.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px"><button class="primary" data-action="start">Повторить сначала →</button><button class="secondary" data-action="menu">На главную</button></div></section>`;
  }
  function render(){
    if(state.screen==='intro')main.innerHTML=startHtml();
    else if(state.screen==='play')main.innerHTML=questionHtml();
    else if(state.screen==='between')main.innerHTML=betweenHtml();
    else main.innerHTML=doneHtml();
  }
  function start(){
    state.screen='play';state.rounds=rounds();state.stage=0;state.turn=0;
    state.correct=0;state.locked=false;state.removed=false;state.help=false;state.mistakes=0;
    render();
  }
  function toggleHint(){
    if(state.locked)return;
    state.help=!state.help;const r=current();
    document.getElementById('hintArea').innerHTML=state.help?hintContent(r):'';
    document.querySelector('.hint-button').textContent=state.help?'Скрыть подсказку':'Нужна подсказка?';
    if(r.kind==='mind')document.querySelector('.visual-area').innerHTML=visual(r);
  }
  function playTone(){
    if(!state.sound)return;
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
      audio=audio||new Ctx();if(audio.state==='suspended')audio.resume();
      const t=audio.currentTime;
      [523.25,659.25].forEach((f,i)=>{
        const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t+i*.11);
        g.gain.exponentialRampToValueAtTime(.07,t+i*.11+.025);
        g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.2);
        o.connect(g).connect(audio.destination);o.start(t+i*.11);o.stop(t+i*.11+.21);
      });
    }catch(e){}
  }
  main.addEventListener('click',e=>{
    const answer=e.target.closest('[data-answer]');if(answer){markAnswer(Number(answer.dataset.answer),answer);return;}
    const action=e.target.closest('[data-action]');if(!action)return;
    switch(action.dataset.action){
      case 'start':start();break;
      case 'menu':state.screen='intro';render();break;
      case 'next':next();break;
      case 'remove':onRemove();break;
      case 'hint':toggleHint();break;
      case 'continue':state.stage++;state.turn=0;state.locked=false;state.removed=false;state.help=false;state.screen='play';render();break;
    }
  });
  soundBtn.addEventListener('click',()=>{state.sound=!state.sound;soundBtn.textContent=state.sound?'♪ Звук: вкл.':'♪ Звук: выкл.';soundBtn.setAttribute('aria-pressed',String(state.sound));if(state.sound)playTone()});
  fullBtn.addEventListener('click',()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{});}catch(e){}});
  render();
})();
</script>
</body>
</html>
