<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Остров тайников — Три острова</title><style>:root{--main:#b47925;--light:#fff0cb}*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#223248;font:17px/1.55 system-ui,Arial,sans-serif}.top{padding:22px 5%;color:white;background:var(--main)}.top h1{margin:0;font-size:clamp(24px,4vw,38px)}.top p{margin:4px 0}.layout{max-width:1180px;margin:18px auto;padding:0 15px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(310px,1.4fr);gap:16px}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 6px 22px #26394a15}.scene{background:linear-gradient(160deg,var(--light),#eef8fc);min-height:235px;border-radius:16px;padding:16px;text-align:center}.islandicon{font-size:70px;margin:5px}.progress{display:flex;gap:6px;margin:16px 0}.dot{flex:1;border-radius:10px;height:12px;background:#d4dfe6}.dot.done{background:var(--main)}.story{color:#56647a}.quest{font-size:21px;font-weight:750}.step{margin:17px 0}label{display:block;font-weight:700;margin-bottom:7px}select,input{width:100%;padding:12px;border:2px solid #ccd9e4;border-radius:11px;font:inherit;background:white;color:#25344b}input{max-width:230px}button{cursor:pointer;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 17px;background:var(--main);color:white;margin:8px 8px 0 0}button:disabled{background:#a7b5c5;cursor:not-allowed}.outline{background:white;color:var(--main);border:2px solid var(--main)}.feedback{margin-top:12px;padding:12px;border-radius:11px;background:#f3f6fa}.ok{background:#e5f7ed;color:#176944}.bad{background:#fff2db;color:#805416}.hidden{display:none}.tiny{font-size:14px;color:#617087}.mission{padding:12px;border:1px solid #dce7ef;border-radius:12px;margin:8px 0;background:#fafcff}.mission.done{border-color:#70c897;background:#edfff4}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.chips span{padding:7px 10px;background:#ffffffc9;border-radius:12px}.banner{background:#193c55;color:white;border-radius:12px;padding:12px;margin-top:14px}hr{border:0;border-top:1px solid #e6edf3;margin:18px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}}@media print{button{display:none}.layout{display:block}}</style></head><body><header class="top"><h1>🗝️ Остров тайников</h1><p>Найди инструкцию смотрителя · Уровень: Средний</p></header><main class="layout"><aside class="panel"><div class="scene"><div class="islandicon" id="island-illustration"></div><h2>Остров тайников</h2><div class="chips"><span>🌊 Океан</span><span>🔎 Исследование</span><span>💎 Кристалл</span></div></div><div class="progress" id="progress"></div><p id="count"></p><div class="banner" id="game-status"></div><div id="game-events"></div><hr><b>Связь с другими островами</b><p class="tiny">После двух испытаний учитель запускает сигнал SOS. Передайте друг другу части общей задачи. После третьего испытания покажите найденный символ карты.</p><button class="outline" onclick="resetGame()">Сбросить прогресс</button></aside><section id="work" class="panel"></section></main><script>const DATA={"name": "Остров тайников", "subtitle": "Найди инструкцию смотрителя", "theme": "gold", "level": "Средний", "symbol": "🗝️", "crystal": "Золотой кристалл", "tasks": [{"title": "Запись старого капитана", "story": "В журнале капитана обнаружена ошибка. Найди верное решение.", "question": "В одном сундуке 9 монет, а во втором в 3 раза больше. Сколько монет в двух сундуках?", "steps": [["Сколько монет во втором сундуке", "Сколько монет в первом сундуке", "На сколько монет больше во втором", "Сколько монет достали"], ["Сколько монет только во втором", "Сколько монет в двух сундуках всего", "Сколько монет осталось", "Сколько сундуков нашли"]], "answers": [27, 36], "event": "🗝️ Получен первый ключ! Капитан ошибся: 27 — только второй сундук.", "hint": "Умножение даст количество лишь во втором сундуке.", "kind": "normal", "correct": [0, 1]}, {"title": "Строка из дневника", "story": "В дневнике стерлось число. Восстанови его вычислениями.", "question": "В трёх одинаковых ящиках лежали компасы. Когда взяли 8 компасов, осталось 16. Сколько компасов было в одном ящике?", "steps": [["Сколько компасов осталось", "Сколько компасов лежит в двух ящиках", "Сколько ящиков опустело", "Сколько компасов было в трёх ящиках сначала"], ["Сколько компасов было в одном ящике", "Сколько компасов взяли из каждого ящика", "Сколько ящиков осталось", "На сколько компасов стало меньше"]], "answers": [24, 8], "event": "📜 Восстановлена страница дневника!", "hint": "Чтобы найти количество в одном ящике, сначала узнай исходное общее количество.", "kind": "normal", "correct": [3, 0]}, {"title": "Карта капитана", "story": "На карте указан запас монет. Но подпись капитана перепутана.", "question": "В 4 сундуках лежало по 8 монет. Капитан отдал 6 монет смотрителю. Сколько монет осталось?", "steps": [["Сколько монет отдали", "Сколько монет в одном сундуке", "Сколько монет было в четырёх сундуках", "Сколько сундуков осталось"], ["Сколько монет капитан получил", "Сколько монет в пяти сундуках", "Сколько монет в двух сундуках", "Сколько монет осталось после передачи"]], "answers": [32, 26], "event": "🗺️ Найден фрагмент карты с символом ключа!", "hint": "Слово «отдал» означает, что количество уменьшилось.", "kind": "normal", "correct": [2, 3]}, {"title": "Фонари для маяка", "story": "Нужные фонари хранятся в запертом трюме.", "question": "На складе 6 коробок по 5 фонарей. Для береговых постов оставили 12 фонарей. Сколько фонарей можно отвезти к маяку?", "steps": [["Сколько фонарей на одном посту", "Сколько всего фонарей на складе", "Сколько коробок осталось", "Сколько фонарей привезли вчера"], ["Сколько фонарей оставили на складе всего", "Сколько коробок нужно", "Сколько фонарей можно отправить к маяку", "Сколько постов на берегу"]], "answers": [30, 18], "event": "🚤 Фонари отправлены к маяку!", "hint": "Найди сначала всё количество фонарей.", "kind": "normal", "correct": [1, 2]}]};let index=0,phase='plan',finished=false;const $=id=>document.getElementById(id);const stageNames=['Восстановление острова','Восстановление острова','Таинственная карта','Последняя буря'];const pauses={2:{title:'📡 Сигнал бедствия',text:'Остановись! Свяжись с другими исследователями. Каждый читает свою часть общего сообщения. Только вместе составьте задачу о 6 аккумуляторах по 8 единиц и расходе 19 единиц. После обсуждения продолжайте.',answer:29},3:{title:'🗺️ Таинственная карта',text:'После третьего задания каждый исследователь получает свой символ карты. Вместе определите маршрут: мост → ключ → шестерёнка.'}};function saved(){try{return JSON.parse(localStorage.getItem('quest_'+DATA.theme)||'{}')}catch(e){return {}}}function save(){try{localStorage.setItem('quest_'+DATA.theme,JSON.stringify({index,phase,finished}))}catch(e){}}function boot(){let s=saved();index=Math.max(0,Math.min(DATA.tasks.length,Number(s.index)||0));phase=s.phase||'plan';finished=!!s.finished;render()}function el(tag,attrs={},txt){const x=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')x.className=v;else x.setAttribute(k,v)});if(txt!==undefined)x.textContent=txt;return x}function render(){const t=DATA.tasks[index];$('progress').innerHTML='';DATA.tasks.forEach((_,i)=>{let d=el('div',{class:'dot'+(i<index?' done':'')});$('progress').append(d)});$('count').textContent=finished?'Миссия завершена':`Испытание ${Math.min(index+1,DATA.tasks.length)} из ${DATA.tasks.length}`;$('island-illustration').textContent=DATA.symbol;$('game-status').textContent=index===0?'🔒 Части острова пока скрыты':index<DATA.tasks.length?Array(index).fill('⭐').join(' ')+' — открыто частей: '+index:DATA.crystal+' найден!';const area=$('work');area.innerHTML='';$('game-events').innerHTML='';if(finished||index>=DATA.tasks.length){area.append(el('h2',{},'🎉 '+DATA.crystal+' найден!'));area.append(el('div',{class:'feedback ok',style:'font-size:26px;text-align:center;font-weight:800'},'🔐 Твоя секретная цифра: 7'));area.append(el('p',{},'Запомни свою цифру и никому не показывай до общего финала! На маяке передай её команде.'));area.append(el('p',{},'Позови учителя. Расскажи другим исследователям, что произошло на твоём острове. Теперь можно открыть общий маяк.'));let reset=el('button',{class:'outline'},'Начать остров заново');reset.onclick=resetGame;area.append(reset);return}area.append(el('div',{class:'tiny'},stageNames[index]));area.append(el('h2',{},t.title));area.append(el('p',{class:'story'},t.story));area.append(el('div',{class:'quest'},t.question));let feed=el('div',{id:'feedback',class:'feedback hidden'});if(phase==='plan'){area.append(el('h3',{},'1. Составь план решения словами'));let selectors=[];t.steps.forEach((options,j)=>{let wrap=el('div',{class:'step'}),lab=el('label',{},['Сначала я узнаю…','Затем я узнаю…','После этого я узнаю…'][j]),select=el('select',{'aria-label':'Шаг '+(j+1)});select.append(el('option',{value:''},'Выбери смысловой шаг'));options.forEach((o,i)=>select.append(el('option',{value:String(i)},o)));wrap.append(lab,select);area.append(wrap);selectors.push(select)});let btn=el('button',{},'Проверить план');btn.onclick=()=>{if(selectors.some(s=>s.value===''))return showFeedback(feed,'Выбери шаг в каждом списке.',false);const yes=selectors.every((s,j)=>Number(s.value)===t.correct[j]);if(yes){phase='solve';save();render()}else{showFeedback(feed,'Попробуй ещё. '+t.hint,false)}};area.append(btn,feed);area.append(el('div',{class:'tiny'},'Правильные варианты перемешаны. Готовое решение не показывается.'))}else if(phase==='solve'){area.append(el('h3',{},'2. Запиши результаты действий'));area.append(el('p',{},'Вычисли каждый шаг своего плана. Введи только полученные числа. Объясни учителю, что они означают.'));const inputs=[];t.answers.forEach((_,j)=>{let wrap=el('div',{class:'step'}),label=el('label',{},'Результат действия '+(j+1)),input=el('input',{type:'number',inputmode:'numeric',placeholder:'Введи число'});wrap.append(label,input);area.append(wrap);inputs.push(input)});let btn=el('button',{},'Проверить вычисления');btn.onclick=()=>{if(inputs.some(x=>x.value.trim()===''))return showFeedback(feed,'Заполни все результаты.',false);let yes=inputs.every((x,j)=>Number(x.value)===t.answers[j]);if(yes){phase='reward';save();render()}else showFeedback(feed,'Есть неточность. Проверь вычисления и смысл действий. Ответы пока не открываются.',false)};area.append(btn,feed)}else{area.append(el('h3',{},'3. Выполни игровое действие'));area.append(el('div',{class:'feedback ok'},t.event));area.append(el('p',{},'Назови учителю ответ на вопрос задачи и объясни, почему именно это число подходит.'));let bt=el('button',{},index===DATA.tasks.length-1?'Завершить миссию':'Получить награду и продолжить');bt.onclick=()=>{if(index===DATA.tasks.length-1){index++;finished=true;phase='plan';save();render();return}index++;phase='plan';save();render()};area.append(bt)} }function showFeedback(node,text,ok){node.textContent=text;node.className='feedback '+(ok?'ok':'bad')}function resetGame(){if(confirm('Сбросить прогресс на этом острове?')){index=0;phase='plan';finished=false;save();render()}}window.addEventListener('DOMContentLoaded',boot);</script></body></html>
