<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица умножения - Обучающие карточки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e0f7ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ff6b9d;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .header p {
            color: #6b5b95;
            font-size: 1.2em;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-container {
            perspective: 1000px;
            height: 250px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            padding: 15px;
        }

        .card-front {
            background: linear-gradient(135deg, #ffd3e1 0%, #ffb3c6 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #b8e6ff 0%, #95d5f7 100%);
            transform: rotateY(180deg);
        }

        .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.9em;
            color: rgba(0,0,0,0.3);
            font-weight: bold;
        }

        .problem {
            font-size: 2.5em;
            font-weight: bold;
            color: #6b5b95;
            text-align: center;
        }

        .answer {
            font-size: 3em;
            font-weight: bold;
            color: #2d6a4f;
            margin-bottom: 10px;
        }

        .visual-hint {
            display: grid;
            gap: 3px;
            max-width: 150px;
            max-height: 120px;
            overflow: hidden;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b9d;
        }

        .emoji-hint {
            font-size: 1.5em;
            text-align: center;
            line-height: 1.4;
            max-height: 100px;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .card-container {
                height: 200px;
            }

            .problem {
                font-size: 2em;
            }

            .answer {
                font-size: 2.5em;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Таблица умножения ✨</h1>
        <p>Нажми на карточку, чтобы увидеть ответ!</p>
    </div>

    <div class="controls">
        <button class="btn" onclick="flipAll()">Перевернуть все</button>
        <button class="btn" onclick="resetAll()">Сбросить все</button>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <script>
        const emojis = ['🍎', '🍌', '🍓', '🍇', '🍊', '⭐', '🌸', '🎈', '🦋', '🐝'];
        const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#4d96ff', '#ff9a56', '#a66cff'];

        function generateCards() {
            const cards = [];
            let cardNum = 1;

            // Генерируем карточки от 2×1 до 9×9
            for (let i = 2; i <= 9; i++) {
                for (let j = 1; j <= 9; j++) {
                    cards.push({
                        num: cardNum++,
                        a: i,
                        b: j,
                        result: i * j
                    });
                }
            }

            // Добавляем 10×1 до 10×8 для получения 80 карточек
            for (let j = 1; j <= 8; j++) {
                cards.push({
                    num: cardNum++,
                    a: 10,
                    b: j,
                    result: 10 * j
                });
            }

            return cards;
        }

        function createVisualHint(a, b) {
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const maxDisplay = Math.min(a, 6);
            const maxItems = Math.min(b, 8);
            
            let html = '<div class="emoji-hint">';
            for (let i = 0; i < maxDisplay; i++) {
                let row = '';
                for (let j = 0; j < maxItems; j++) {
                    row += emoji;
                }
                if (maxDisplay < a) {
                    row += '...';
                }
                html += row + '<br>';
            }
            if (maxDisplay < a) {
                html += '...<br>';
            }
            html += '</div>';
            
            return html;
        }

        function createCard(card) {
            const container = document.createElement('div');
            container.className = 'card-container';
            
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.onclick = () => cardEl.classList.toggle('flipped');
            
            const front = document.createElement('div');
            front.className = 'card-face card-front';
            front.innerHTML = `
                <div class="card-number">#${card.num}</div>
                <div class="problem">${card.a} × ${card.b}</div>
            `;
            
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = `
                <div class="card-number">#${card.num}</div>
                <div class="answer">${card.result}</div>
                ${createVisualHint(card.a, card.b)}
            `;
            
            cardEl.appendChild(front);
            cardEl.appendChild(back);
            container.appendChild(cardEl);
            
            return container;
        }

        function init() {
            const grid = document.getElementById('cardsGrid');
            const cards = generateCards();
            
            cards.forEach(card => {
                grid.appendChild(createCard(card));
            });
        }

        function flipAll() {
            document.querySelectorAll('.card').forEach(card => {
                card.classList.add('flipped');
            });
        }

        function resetAll() {
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('flipped');
            });
        }

        init();
    </script>
</body>
</html>
